titre: "Infos pratiques"
intro: "Ici, tout ce qu'il faut savoir avant de venir. Pour l'instant, c'est en préparation. Les infos arrivent dès qu'elles sont fixées."
# statut : laisser vide quand l'info est fixée ; sinon « bientôt » ou « à venir ».
cartes:
  - titre: "S'inscrire"
    statut: "bientôt"
    texte: "Les inscriptions ouvriront sur une plateforme en ligne. Tu verras ici le prix, la date de clôture et si l'inscription sur place est possible. Pense à t'inscrire à notre liste « Préviens-moi ».\n\n[Aller au « Préviens-moi » →](index.html#previens-moi)"
  - titre: "Justificatif médical"
    statut: "à venir"
    texte: "On t'expliquera ici, en deux lignes, ce qu'il faut pour courir et pour marcher."
  - titre: "Accès et parking"
    statut: "bientôt"
    texte: "Lieu de départ à Saint-Nazaire : bientôt."
  - titre: "Covoiturage"
    statut: "bientôt"
    texte: ""
  - titre: "Hébergement"
    statut: "bientôt"
    texte: ""
  - titre: "Règlement"
    statut: "à venir"
    texte: "Publié avant l'ouverture des inscriptions."
faq_titre: "Les questions qu'on nous pose"
faq:
  - question: "C'est quoi, le D+ ?"
    reponse: "Le dénivelé positif : tout ce que tu montes pendant la course. Et comme notre nom l'indique, on compte bien mettre l'accent dessus."
  - question: "Je n'ai jamais fait de trail, c'est pour moi ?"
    reponse: "Oui. Le 8 km et la rando sont le meilleur moyen de t'essayer au trail et de découvrir le parcours qu'on a ouvert pour toi."
  - question: "La rando, c'est pour qui ?"
    reponse: "Tu ne cours pas, mais tu as envie de découvrir le parcours à ton rythme ? Ou tu accompagnes un pote ou un proche qui s'attaque au trail ? La rando est faite pour toi : tu prends le même départ et tu franchis la même ligne d'arrivée que tout le monde, sans chrono ni classement."
  - question: "Comment savoir quand les inscriptions ouvrent ?"
    reponse: "Inscris-toi à notre liste « Préviens-moi » ou suis-nous sur Instagram."
    bouton_texte: "Préviens-moi"
    bouton_lien: "index.html#previens-moi"
  - question: "Qui organise ?"
    reponse: "Gard Ô D+, une asso de 3 associés basée dans le Gard."
